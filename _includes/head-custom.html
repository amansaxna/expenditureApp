<!-- Enhanced Markdown Image & Gallery Table Styles for GitHub Pages -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%230F172A'/><rect x='28' y='38' width='14' height='26' rx='7' fill='%2338BDF8'/><rect x='58' y='38' width='14' height='26' rx='7' fill='%2338BDF8'/></svg>" />
<style>
  :root {
    --brand-bg: #0B1019;
    --brand-surface: #0F172A;
    --brand-card: #1E293B;
    --brand-cyan: #38BDF8;
    --brand-indigo: #4F46E5;
    --brand-mint: #10B981;
    --brand-coral: #F43F5E;
  }

  /* Table styling enhancements for static page */
  .markdown-body table {
    display: table;
    width: 100%;
    margin: 1.5rem 0 2rem 0;
    border-collapse: separate;
    border-spacing: 12px 8px;
    border: none;
    background: transparent;
  }

  @media (max-width: 820px) {
    .markdown-body table {
      display: block;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-spacing: 8px 6px;
    }
  }

  .markdown-body table tr {
    background: transparent !important;
    border: none !important;
  }

  .markdown-body table th {
    background: #0F172A !important;
    color: #F8FAFC !important;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.08) !important;
    text-align: center;
  }

  .markdown-body table td {
    padding: 6px;
    border: none !important;
    text-align: center;
    vertical-align: top;
    background: transparent !important;
  }

  /* Screenshot & Gallery Image Enhancements */
  .markdown-body table td img {
    border-radius: 16px;
    border: 1px solid rgba(15, 23, 42, 0.12);
    box-shadow: 0 10px 25px -4px rgba(15, 23, 42, 0.16), 0 4px 10px -2px rgba(15, 23, 42, 0.08);
    max-height: 520px;
    width: auto;
    max-width: 100%;
    object-fit: contain;
    background-color: #0B1019;
    display: inline-block;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .markdown-body table td img:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 20px 35px -4px rgba(15, 23, 42, 0.25), 0 8px 16px -2px rgba(15, 23, 42, 0.12);
  }

  /* Captions inside tables */
  .markdown-body table td em {
    display: block;
    margin-top: 8px;
    font-size: 0.8rem;
    line-height: 1.4;
    color: #64748B;
    font-style: normal;
    font-weight: 500;
  }

  /* Centered spotlight images (excluding badges) */
  .markdown-body p[align="center"] img:not([src*="shields.io"]) {
    border-radius: 16px;
    border: 1px solid rgba(15, 23, 42, 0.1);
    box-shadow: 0 12px 30px -4px rgba(15, 23, 42, 0.15);
    transition: transform 0.25s ease;
  }

  .markdown-body p[align="center"] img:not([src*="shields.io"]):hover {
    transform: translateY(-3px);
  }

  /* Badges: Clean, unshadowed, and aligned */
  .markdown-body img[src*="shields.io"],
  .markdown-body a img[src*="shields.io"],
  .markdown-body p[align="center"] img[src*="shields.io"] {
    border: none !important;
    border-radius: 4px !important;
    box-shadow: none !important;
    background: transparent !important;
    vertical-align: middle;
    margin: 3px 4px !important;
    transition: transform 0.15s ease;
  }

  .markdown-body a img[src*="shields.io"]:hover {
    transform: translateY(-2px);
  }

  /* Text tables formatting (Architecture, Channels, Emotion Matrix) */
  .markdown-body table:not(:has(img)) {
    border-collapse: collapse;
    border-spacing: 0;
    border: 1px solid #E2E8F0;
    border-radius: 10px;
    overflow: hidden;
  }

  .markdown-body table:not(:has(img)) th {
    border-radius: 0;
    border: 1px solid #334155 !important;
    text-align: left;
  }

  .markdown-body table:not(:has(img)) td {
    border: 1px solid #E2E8F0 !important;
    padding: 10px 14px;
    text-align: left;
    background: #FFFFFF !important;
  }

  .markdown-body table:not(:has(img)) tr:nth-child(2n) td {
    background: #F8FAFC !important;
  }

  /* Mermaid Architecture Diagram Container */
  .mermaid-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 14px;
    padding: 24px 16px;
    margin: 1.5rem 0 2rem 0;
    box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.06);
    overflow-x: auto;
  }

  .mermaid-wrapper .mermaid {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .mermaid-wrapper svg {
    max-width: 100%;
    height: auto;
  }
</style>

<!-- Mermaid.js support for GitHub Pages -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  
  mermaid.initialize({
    startOnLoad: false,
    theme: 'neutral',
    securityLevel: 'loose',
    fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
  });

  document.addEventListener('DOMContentLoaded', async () => {
    const mermaidBlocks = document.querySelectorAll('pre code.language-mermaid, .language-mermaid');
    if (!mermaidBlocks.length) return;

    for (const codeBlock of mermaidBlocks) {
      const pre = codeBlock.closest('pre') || codeBlock;
      const graphDefinition = codeBlock.textContent.trim();
      const wrapper = document.createElement('div');
      wrapper.className = 'mermaid-wrapper';
      const container = document.createElement('div');
      container.className = 'mermaid';
      container.textContent = graphDefinition;
      wrapper.appendChild(container);
      pre.parentNode.replaceChild(wrapper, pre);
    }

    try {
      await mermaid.run();
    } catch (err) {
      console.error('Mermaid render error:', err);
    }
  });
</script>
